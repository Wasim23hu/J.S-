<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <!-- Task 1 -->
        <div class="box">
            <div class="row">
                <label>Enter Age (Years)</label>
                <input type="text" id="task1-input" placeholder="e.g. 20">
            </div>
            <div class="row">
                <label>Days</label>
                <input type="text" id="task1-output" readonly>
            </div>
            <button onclick="handleTask1()">Convert</button>
        </div>

        <!-- Task 2 -->
        <div class="box">
            <div class="row">
                <label>Enter Hours</label>
                <input type="text" id="task2-input" placeholder="e.g. 2">
            </div>
            <div class="row">
                <label>Seconds</label>
                <input type="text" id="task2-output" readonly>
            </div>
            <button onclick="handleTask2()">Convert</button>
        </div>

        <!-- Task 3 -->
        <div class="box">
            <div class="row">
                <label>Enter Value</label>
                <input type="text" id="task3-input" placeholder="e.g. 5 or 5.5">
            </div>
            <div class="row">
                <label>Next Number</label>
                <input type="text" id="task3-output" readonly>
            </div>
            <button onclick="handleTask3()">Find Next</button>
        </div>

        <!-- Task 4 -->
        <div class="box">
            <div class="row">
                <label>Enter Name</label>
                <input type="text" id="task4-input" placeholder="e.g. shahzaib">
            </div>
            <div class="row">
                <label>Formatted Name</label>
                <input type="text" id="task4-output" readonly>
            </div>
            <button onclick="handleTask4()">Capitalize</button>
        </div>

        <!-- Task 5 -->
        <div class="box">
            <div class="row">
                <label>Weight (kg)</label>
                <input type="text" id="task5-weight" placeholder="e.g. 70">
            </div>
            <div class="row">
                <label>Height (m)</label>
                <input type="text" id="task5-height" placeholder="e.g. 1.75">
            </div>
            <div class="row">
                <label>BMI Result</label>
                <input type="text" id="task5-output" readonly>
            </div>
            <button onclick="handleTask5()">Calculate BMI</button>
        </div>

        <!-- Task 6 -->
        <div class="box">
            <div class="row">
                <label>Array</label>
                <input type="text" id="task6-display" readonly placeholder="Click generate">
            </div>
            <div class="row">
                <label>First & Last</label>
                <input type="text" id="task6-output" readonly>
            </div>
            <button onclick="handleTask6()">Generate</button>
        </div>

        <!-- Task 7 -->
        <div class="box">
            <div class="row">
                <label>Enter First Number</label>
                <input type="text" id="num1" placeholder="e.g. 10">
            </div>
            <div class="row">
                <label>Enter Second Number</label>
                <input type="text" id="num2" placeholder="e.g. 20">
            </div>
            <div class="row">
                <label>Result</label>
                <input type="text" id="result" readonly>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
